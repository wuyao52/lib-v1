# Netlify 配置

# API 代理重定向
[[redirects]]
  from = "/api/hongniaoai/v1/models"
  to = "/.netlify/functions/proxy?path=v1/models"
  status = 200

[[redirects]]
  from = "/api/hongniaoai/v1/videos"
  to = "/.netlify/functions/proxy?path=v1/videos"
  status = 200

[[redirects]]
  from = "/api/hongniaoai/v1/videos/*"
  to = "/.netlify/functions/proxy?path=v1/videos/:splat"
  status = 200

[[redirects]]
  from = "/api/hongniaoai/v1/images"
  to = "/.netlify/functions/proxy?path=v1/images"
  status = 200

[[redirects]]
  from = "/api/hongniaoai/v1/images/*"
  to = "/.netlify/functions/proxy?path=v1/images/:splat"
  status = 200

# SPA 路由重定向（放在最后）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200