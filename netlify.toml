# Netlify configuration

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# The browser stays on the Netlify origin. This function forwards protected API
# calls to the separately deployed Node service configured with API_ORIGIN.
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/backend/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/director/*"
  to = "/.netlify/functions/backend/director/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/skills/*"
  to = "/.netlify/functions/backend/skills/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/projects/*"
  to = "/.netlify/functions/backend/projects/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/assets/*"
  to = "/.netlify/functions/backend/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/backend/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/billing/*"
  to = "/.netlify/functions/backend/billing/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/catalog/*"
  to = "/.netlify/functions/backend/catalog/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/system-ai/*"
  to = "/.netlify/functions/backend/system-ai/:splat"
  status = 200
  force = true

# WuhenAI API proxy
[[redirects]]
  from = "/api/wuhenai/*"
  to = "/.netlify/functions/proxy?service=wuhenai&path=:splat"
  status = 200

# 红鸟AI API 代理
[[redirects]]
  from = "/api/hongniaoai/*"
  to = "/.netlify/functions/proxy?service=hongniaoai&path=:splat"
  status = 200

# SPA 路由重定向（放在最后）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
