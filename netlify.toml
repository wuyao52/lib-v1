# Netlify 配置

# 无痕AI API 代理
[[redirects]]
  from = "/api/wuhenai/*"
  to = "/.netlify/functions/proxy?service=wuhenai&path=:splat"
  status = 200

# 红鸟AI API 代理
[[redirects]]
  from = "/api/hongniaoai/*"
  to = "/.netlify/functions/proxy?service=hongniaoai&path=:splat"
  status = 200

# SPA 路由重定向（放在最后）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200